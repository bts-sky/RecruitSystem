<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1769e0">
  <title>모바일 면접 지원서</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">
    <section class="hero">
      <p class="eyebrow">RECRUIT APPLICATION</p>
      <h1>모바일 면접 지원서</h1>
      <p>필수 항목을 정확히 작성한 뒤 제출해 주세요.</p>
    </section>

    <form id="applicationForm" class="card" novalidate>
      <section class="form-section">
        <h2>기본정보</h2>

        <label>
          <span>성명 <b>*</b></span>
          <input name="name" type="text" maxlength="30" autocomplete="name" required placeholder="예: 홍길동">
        </label>

        <label>
          <span>연락처 <b>*</b></span>
          <input name="phone" type="tel" inputmode="numeric" maxlength="13" autocomplete="tel" required placeholder="010-1234-5678">
        </label>

        <label>
          <span>생년월일 <b>*</b></span>
          <input name="birthDate" type="date" required>
        </label>

        <label>
          <span>주소 <b>*</b></span>
          <input name="address" type="text" maxlength="120" autocomplete="street-address" required placeholder="현재 거주지">
        </label>
      </section>

      <section class="form-section">
        <h2>지원정보</h2>

        <label>
          <span>지원분야 <b>*</b></span>
          <input name="position" type="text" maxlength="50" required placeholder="예: 생산직 / 품질검사">
        </label>

        <label>
          <span>희망근무지 <b>*</b></span>
          <input name="workLocation" type="text" maxlength="80" required placeholder="예: 천안 서북구">
        </label>

        <label>
          <span>학력</span>
          <textarea name="education" rows="3" maxlength="500" placeholder="최종학력, 학교명, 졸업 여부 등을 작성해 주세요."></textarea>
        </label>

        <label>
          <span>경력사항</span>
          <textarea name="career" rows="5" maxlength="1500" placeholder="회사명, 근무기간, 담당업무 등을 작성해 주세요. 경력이 없으면 '신입'이라고 적어 주세요."></textarea>
        </label>

        <label>
          <span>자기소개</span>
          <textarea name="introduction" rows="6" maxlength="2000" placeholder="지원동기, 장점, 근무 가능일 등을 자유롭게 작성해 주세요."></textarea>
        </label>
      </section>

      <section class="consent">
        <label class="check-row">
          <input name="privacyAgreement" type="checkbox" required>
          <span><a href="privacy.html" target="_blank" rel="noopener">개인정보 수집·이용 안내</a>를 확인했으며 이에 동의합니다. <b>*</b></span>
        </label>
      </section>

      <div id="message" class="message" role="status" aria-live="polite"></div>

      <button id="submitButton" class="submit-button" type="submit">
        지원서 제출
      </button>

      <p class="notice">제출 버튼은 한 번만 눌러 주세요. 처리에는 몇 초가 걸릴 수 있습니다.</p>
    </form>
  </main>

  <script src="script.js"></script>
</body>
</html>
